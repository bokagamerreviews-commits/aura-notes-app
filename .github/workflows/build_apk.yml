name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Generate Android Platform Files and Disable Lint Bug
        run: |
          flutter create --platforms=android --org com.sohan.notepad --project-name aura_notes .
          python3 tool/patch_android_manifest.py
          python3 - << 'EOF'
          for path in ["android/app/build.gradle", "android/app/build.gradle.kts"]:
              if __import__("os").path.exists(path):
                  with open(path, "r") as f:
                      c = f.read()
                  if "checkReleaseBuilds" not in c:
                      if path.endswith(".kts"):
                          c += "\nandroid { lint { checkReleaseBuilds = false; abortOnError = false } }\n"
                      else:
                          c += "\nandroid { lintOptions { checkReleaseBuilds false; abortOnError false } }\n"
                  with open(path, "w") as f:
                      f.write(c)
          EOF

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Rename APK for Easy Download
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/AuraNotes-v1.0.0.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraNotes-Release-APK
          path: build/app/outputs/flutter-apk/AuraNotes-v1.0.0.apk
          if-no-files-found: error
